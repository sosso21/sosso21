<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Full-Stack TypeScript Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#111a2e"/>
      <stop offset="100%" stop-color="#1b1035"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3178c6">
        <animate attributeName="stop-color" values="#3178c6;#a855f7;#22d3ee;#3178c6" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#22d3ee;#3178c6;#a855f7" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#3178c6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3178c6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1200" height="320" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>

    <circle cx="180" cy="60" r="220" fill="url(#glow1)">
      <animate attributeName="cx" values="180;260;180" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1040" cy="280" r="240" fill="url(#glow2)">
      <animate attributeName="cy" values="280;220;280" dur="10s" repeatCount="indefinite"/>
    </circle>

    <!-- floating code fragments -->
    <g font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="15" fill="#8b949e" fill-opacity="0.35">
      <text x="60" y="270">const dev = { stack: "fullstack" };</text>
      <text x="880" y="56">&lt;?php echo "Hello World"; ?&gt;</text>
      <text x="900" y="300">export default App;</text>
      <text x="70" y="48">import { Injectable } from "@nestjs/common";</text>
    </g>

    <!-- terminal window -->
    <g transform="translate(250 70)">
      <rect width="700" height="180" rx="12" fill="#0d1117" fill-opacity="0.75" stroke="url(#accent)" stroke-width="1.5"/>
      <circle cx="22" cy="20" r="6" fill="#ff5f56"/>
      <circle cx="42" cy="20" r="6" fill="#ffbd2e"/>
      <circle cx="62" cy="20" r="6" fill="#27c93f"/>
      <line x1="0" y1="40" x2="700" y2="40" stroke="#30363d" stroke-width="1"/>

      <text x="350" y="100" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="url(#accent)">&lt;/&gt; Full-Stack Developer</text>
      <text x="350" y="140" text-anchor="middle" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="18" fill="#c9d1d9">
        TypeScript · React · Node.js · NestJS · PHP
      </text>
      <rect x="577" y="126" width="10" height="18" fill="#22d3ee">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <rect x="0" y="316" width="1200" height="4" fill="url(#accent)"/>
  </g>
</svg>
